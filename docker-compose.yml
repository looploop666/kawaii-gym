services:
  # Base de desarrollo: los datos persisten en un volumen entre reinicios.
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      # Desde Postgres 18 la imagen guarda los datos en un subdirectorio por versión,
      # por eso se monta /var/lib/postgresql y no /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10

  # Base de los tests e2e: en memoria (tmpfs), se pierde al bajar el contenedor.
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
